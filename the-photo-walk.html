<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f3eadc">
<meta name="description" content="A small walk. A camera. A few things worth noticing.">
<title>The Photo Walk</title>
<style>
  :root {
    --parchment: #f3eadc;
    --cream: #fbf7ef;
    --ink: #2a2622;
    --ink-soft: #5e564c;
    --line: rgba(42, 38, 34, 0.16);
    --ink-soft: color-mix(in srgb, var(--ink) 58%, var(--parchment));
    --line: color-mix(in srgb, var(--ink) 16%, transparent);
    --sage: #6d7c66;
    --moss: #3e4f3c;
    --rust: #9c5842;
    --stone: #cbb89a;
    --water: #6f8b98;
    --shadow: 0 14px 34px rgba(42, 38, 34, 0.08);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Helvetica, sans-serif;
    --hand: "Bradley Hand", "Segoe Script", "Apple Chancery", "Snell Roundhand", cursive;
    --page: 800px;
    --text: 40rem;
    --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255, 250, 242, 0.85), transparent 58%),
      var(--parchment);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    touch-action: manipulation;
  }

  body.is-modal { overflow: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.045;
    background-image: var(--noise);
    background-size: 180px 180px;
    mix-blend-mode: multiply;
    z-index: 0;
  }

  .utility, main, .skip { position: relative; z-index: 1; }

  .utility {
    position: sticky;
    top: 0;
    z-index: 4;
    background: var(--parchment);
    border-bottom: 1px solid transparent;
    padding-top: env(safe-area-inset-top);
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 52px;
    padding: 4px 0;
  }

  .wrap {
    width: min(var(--page), calc(100% - 28px));
    margin-inline: auto;
  }

  .roll, .count, .util-btn, .eyebrow, .scene-head h1, .scene-head p, .capture-head h1, .capture-head p, .kicker, .trait, .mat-foot, .ph-meta, .lb-count {
    font-family: var(--sans);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .roll, .count {
    margin: 0;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dots {
    display: flex;
    gap: 4px;
  }

  .dots span {
    width: 9px;
    height: 13px;
    border: 1px solid rgba(42, 38, 34, 0.32);
    border-color: color-mix(in srgb, var(--ink) 32%, transparent);
    border-radius: 1px;
    background: transparent;
  }

  .dots span.is-on {
    background: var(--moss);
    border-color: var(--moss);
  }

  button, .skip {
    font: inherit;
    color: inherit;
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(62, 79, 60, 0.14);
  }

  .util-btn {
    appearance: none;
    background: transparent;
    border: 0;
    padding: 10px 2px;
    min-height: 44px;
    min-width: 44px;
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .util-btn[aria-pressed="true"] { color: var(--moss); }

  .skip {
    position: absolute;
    left: 12px;
    top: -48px;
    background: var(--ink);
    color: var(--cream);
    padding: 8px 12px;
    z-index: 6;
    text-decoration: none;
  }

  .skip:focus { top: 10px; }

  :focus { outline: none; }

  :focus-visible {
    outline: 2px solid var(--moss);
    outline-offset: 3px;
  }

  @supports not selector(:focus-visible) {
    :focus {
      outline: 2px solid var(--moss);
      outline-offset: 3px;
    }
  }

  [hidden] { display: none !important; }

  main {
    padding-bottom: calc(36px + env(safe-area-inset-bottom));
  }

  .title-screen {
    min-height: calc(100vh - 64px);
    min-height: calc(100dvh - 64px);
    display: grid;
    align-content: safe center;
    padding: 18px 0 42px;
    text-align: center;
  }

  .title-copy {
    width: min(100%, 36rem);
    margin: 18px auto 0;
  }

  h1.game-title {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(46px, 9vw, 76px);
    letter-spacing: -0.03em;
    line-height: 0.92;
    text-wrap: balance;
  }

  .subtitle {
    margin: 16px auto 0;
    max-width: 22em;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(18px, 2.4vw, 22px);
    line-height: 1.45;
    color: var(--ink);
  }

  .whisper {
    margin: 16px 0 0;
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
  }

  .scene, .capture, .album, .title-screen {
    animation: rise 0.55s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .scene-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 22px 0 10px;
  }

  .scene-head h1, .capture-head h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
  }

  .scene-head p, .capture-head p {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .print, .mat, .photo-card, .lb-card {
    background: var(--cream);
    box-shadow: var(--shadow);
  }

  .print { padding: 10px; }

  .art-slot { position: relative; background: #d9d0c2; }

  .art-slot .art { display: block; width: 100%; height: auto; }

  .art-slot::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.14;
    mix-blend-mode: multiply;
    background-image: var(--noise);
    background-size: 160px 160px;
  }

  .prose {
    max-width: var(--text);
    margin-top: 22px;
    font-family: var(--serif);
    font-size: 1.0625rem;
    line-height: 1.62;
  }

  .prose p { margin: 0; }

  .prose p + p { margin-top: 0.85em; }

  .choices {
    max-width: var(--text);
    display: grid;
    gap: 8px;
    margin-top: 22px;
  }

  .choice, .btn, .photo-card, .text-btn, .icon-btn {
    cursor: pointer;
  }

  .choice {
    appearance: none;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    border-left-width: 3px;
    border-left-color: transparent;
    border-radius: 2px;
    min-height: 52px;
    padding: 14px 16px;
    font-family: var(--sans);
    font-size: 16.5px;
    line-height: 1.35;
    color: var(--ink);
  }

  .choice:hover,
  .choice:focus-visible {
    background: rgba(255, 252, 246, 0.72);
    border-color: rgba(42, 38, 34, 0.28);
    border-left-color: var(--moss);
  }

  .choice:active { background: rgba(62, 79, 60, 0.06); }

  .btn {
    appearance: none;
    border: 0;
    background: var(--moss);
    color: #f6f1e6;
    min-height: 52px;
    padding: 14px 22px;
    border-radius: 2px;
    letter-spacing: 0.03em;
    font-size: 16px;
  }

  .btn:hover { background: #314032; }

  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }

  .btn-ghost:hover { background: rgba(255, 252, 246, 0.75); }

  .title-actions { margin-top: 26px; }

  .capture { padding-top: 8px; }

  .capture-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 22px 0 12px;
  }

  .passage {
    max-width: var(--text);
    margin: 0 0 18px;
    font-family: var(--serif);
    font-size: 1.0625rem;
    line-height: 1.62;
  }

  .finder {
    position: relative;
    background: #1a1714;
    padding: 16px;
    max-width: 100%;
  }

  .finder.is-developed {
    background: transparent;
    padding: 0;
  }

  .corners span {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 0 solid rgba(255, 248, 236, 0.92);
    z-index: 3;
  }

  .corners span:nth-child(1) { top: 7px; left: 7px; border-top-width: 1.5px; border-left-width: 1.5px; }
  .corners span:nth-child(2) { top: 7px; right: 7px; border-top-width: 1.5px; border-right-width: 1.5px; }
  .corners span:nth-child(3) { bottom: 7px; left: 7px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
  .corners span:nth-child(4) { bottom: 7px; right: 7px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

  .finder.is-developed .corners { opacity: 0; }

  .shutter {
    position: absolute;
    inset: 0;
    background: #14110e;
    transform: scaleY(0);
    transform-origin: top center;
    z-index: 4;
    pointer-events: none;
  }

  .finder.is-shutter .shutter { animation: shutterBlink 520ms ease-in-out; }

  @keyframes shutterBlink {
    0% { transform: scaleY(0); }
    32% { transform: scaleY(1); }
    58% { transform: scaleY(1); }
    100% { transform: scaleY(0); }
  }

  .finder .mat {
    background: transparent;
    box-shadow: none;
    padding: 0;
  }

  .finder.is-developed .mat {
    background: var(--cream);
    padding: 10px 10px 8px;
    box-shadow: var(--shadow);
  }

  .finder .art-slot {
    filter: contrast(0.92) brightness(1.65) saturate(0.2);
    transition: filter 1s ease;
  }

  .finder.is-developed .art-slot { filter: none; }

  .mat-foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 2px 2px;
    font-size: 10px;
    color: var(--ink-soft);
  }

  .capture-copy {
    max-width: var(--text);
    margin-top: 18px;
  }

  .kicker {
    min-height: 1.2em;
    margin: 0 0 6px;
    font-size: 11px;
    color: var(--moss);
  }

  .capture-copy h2 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(30px, 5vw, 42px);
    letter-spacing: -0.025em;
    line-height: 1.05;
    overflow-wrap: break-word;
  }

  .capture-caption {
    margin: 10px 0 0;
    max-width: 36em;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.5;
  }

  .reveal {
    opacity: 0;
    transform: translateY(6px);
  }

  .capture.is-ready .reveal {
    opacity: 1;
    transform: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .capture-copy .btn { margin-top: 18px; }

  .album { padding-top: 18px; }

  .album-kicker {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .eyebrow {
    margin: 0;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .icon-btn {
    appearance: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    padding: 0;
  }

  .icon-btn svg { width: 22px; height: 16px; display: block; }

  .icon-btn.is-tapped { animation: nod 0.35s ease; }

  @keyframes nod {
    0% { transform: rotate(0deg); }
    40% { transform: rotate(-10deg); }
    100% { transform: rotate(0deg); }
  }

  .album h1, .lb-card h2 {
    margin: 6px 0 0;
    font-family: var(--serif);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 0.95;
  }

  .album h1 { font-size: clamp(44px, 8vw, 68px); }

  .secret-slot { min-height: 0; }

  .secret-line {
    margin: 14px 0 0;
    font-family: var(--hand);
    font-size: 1.35rem;
    line-height: 1.35;
    color: #3d342c;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 22px;
    padding: 4px;
  }

  .photo-card {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 1px;
    padding: 10px 10px 14px;
    color: inherit;
    transform: rotate(var(--tilt));
  }

  .photo-card:hover, .photo-card:focus-visible {
    box-shadow: 0 18px 38px rgba(42, 38, 34, 0.12);
  }

  #view-title, #passage, #lb-title { scroll-margin-top: 76px; }

  .ph-title {
    display: block;
    margin-top: 10px;
    font-family: var(--serif);
    font-size: 1.35rem;
    letter-spacing: -0.02em;
    line-height: 1.15;
    overflow-wrap: break-word;
  }

  .ph-meta, .lb-meta {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.12em;
  }

  .ph-caption, .lb-caption {
    display: block;
    margin-top: 8px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1rem;
    line-height: 1.45;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    overflow-wrap: break-word;
  }

  .reflection {
    max-width: 38rem;
    margin: 36px auto 0;
    text-align: center;
  }

  .reflection p {
    margin: 0;
    font-family: var(--serif);
    font-size: 1.12rem;
    line-height: 1.6;
  }

  .reflection p + p { margin-top: 0.9em; }

  .trait { font-size: 12px; color: var(--moss); }

  .landing {
    font-style: italic;
    font-size: 1.4rem !important;
    margin-top: 1.15rem !important;
  }

  .rule {
    width: 42px;
    height: 1px;
    margin: 32px auto;
    border: 0;
    background: var(--line);
  }

  .note {
    max-width: 34rem;
    margin: 0 auto;
    background: #fbf6ec;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 1.35rem 1.25rem 1.15rem;
    transform: rotate(-0.35deg);
  }

  .note p {
    margin: 0;
    font-family: var(--hand);
    font-size: clamp(1.25rem, 3vw, 1.55rem);
    line-height: 1.4;
    color: #3a322b;
    overflow-wrap: break-word;
  }

  .note p + p { margin-top: 0.75em; }

  .note .for { margin-bottom: 0.15em; }

  .note .sign { margin-top: 0.9em; }

  .end-actions {
    display: flex;
    justify-content: center;
    margin-top: 28px;
  }

  .end-actions .btn { min-width: min(100%, 240px); }

  .poster-slot { margin-bottom: 8px; }

  #lightbox {
    border: 0;
    padding: 0;
    margin: auto;
    background: transparent;
    width: min(640px, calc(100% - 24px));
    max-width: calc(100% - 24px);
    max-height: calc(100vh - 24px);
    max-height: calc(100dvh - 24px);
    overflow: auto;
    box-shadow: none;
  }

  #lightbox::backdrop { background: rgba(28, 24, 20, 0.78); }

  .lb-card {
    padding: 12px 12px 18px;
    position: relative;
  }

  .lb-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .lb-count {
    margin: 0;
    font-size: 10px;
    color: var(--ink-soft);
  }

  .text-btn {
    appearance: none;
    background: transparent;
    border: 0;
    min-height: 44px;
    padding: 8px 4px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .lb-card h2 {
    margin-top: 12px;
    font-size: clamp(28px, 5vw, 40px);
  }

  .lb-nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
  }

  .text-btn:disabled { opacity: 0.35; cursor: default; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .leaf { animation: sway 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  .cloud { animation: drift 46s linear infinite; }
  .fall { animation: trickle 2.8s ease-in-out infinite; }
  .reflection { animation: shimmer 5.5s ease-in-out infinite; }
  .bee { animation: buzz 7s ease-in-out infinite; }
  .dapple { animation: glow 6s ease-in-out infinite; }

  @keyframes sway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2.4deg); }
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(36px); }
  }

  @keyframes trickle {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.38; }
    50% { opacity: 0.62; }
  }

  @keyframes buzz {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(7px, -5px); }
  }

  @keyframes glow {
    0%, 100% { opacity: 0.18; }
    50% { opacity: 0.38; }
  }

  ::selection { background: #e4d3b4; color: var(--ink); }

  @media (min-width: 720px) {
    .prose, .passage { font-size: 1.15rem; }
    .grid { grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid .photo-card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      width: min(100%, 430px);
      justify-self: center;
    }
  }

  @media (max-width: 390px) {
    .dots { display: none; }
    .wrap { width: min(var(--page), calc(100% - 22px)); }
    .photo-card, .note { transform: none; }
  }

  @media (max-width: 360px) {
    .roll, .count, .util-btn { letter-spacing: 0.06em; }
    .top-actions { gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .photo-card, .note, .reveal { transform: none !important; }
  }
</style>
</head>
<body>
  <a class="skip" href="#main">Skip to the walk</a>
  <header class="utility">
    <div class="wrap bar">
      <p class="roll" id="rollLabel">Roll 01</p>
      <div class="top-actions">
        <div class="top-actions" id="progressCluster">
          <p class="count" id="countLabel">0 / 5 <span class="sr-only">photographs</span></p>
          <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <button type="button" class="util-btn" id="muteBtn" data-action="mute" aria-pressed="false">Sound off</button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"></main>
  <dialog id="lightbox" aria-label="Photograph"></dialog>
  <noscript>
    <p class="wrap prose">The Photo Walk needs JavaScript to open. It is still just the one file.</p>
  </noscript>

<script>
/* ============================================================
   CONFIG
   Edit this object to personalize the walk.
   Nothing else needs to change.

   recipientName   Her name. Leave HER_NAME (or blank) to omit it.
   senderName      Your name. Leave YOUR_NAME (or blank) to omit the signature.
   finalMessage    The note at the end. A blank line starts a new paragraph.
                   You can write {name} and {sender} inside it if you want.
   showPersonalMessage   false hides the note.
   secretMessage   Appears only if the little camera on the last page
                   is tapped three times. Not required to finish.
   colors          Interface only: paper, ink, buttons. The pictures
                   keep their own paints.
   ============================================================ */
const CONFIG = {
  title: "The Photo Walk",
  recipientName: "HER_NAME",
  senderName: "YOUR_NAME",
  showPersonalMessage: true,
  finalMessage: "I know you haven't been getting out with your camera as much lately, so I thought I'd give you a little photo walk of your own.\n\nNo particular reason. I just thought you'd like it.",
  secretMessage: "P.S. You should probably go take some photographs again sometime.",
  colors: {
    parchment: "#f3eadc",
    cream: "#fbf7ef",
    ink: "#2a2622",
    sage: "#6d7c66",
    moss: "#3e4f3c",
    rust: "#9c5842",
    stone: "#cbb89a",
    water: "#6f8b98"
  }
};

/* ============================================================
   GAME DATA
   ============================================================ */
const SCENES = [
  {

function prefersReduced() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function later(fn, ms) {
  const id = setTimeout(fn, ms);
  timers.push(id);
  return id;
}

function clearTimers() {
  timers.forEach(clearTimeout);
  timers = [];
}

function holdInput(ms) {
  const until = Date.now() + ms;
  if (until > heldUntil) heldUntil = until;
}

function inputOpen() {
  return Date.now() >= heldUntil;
}

function escapeHtml(value) {
  if (value == null) return "";
  if (typeof value !== "string" && typeof value !== "number") return "";
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function realName(value) {
  const cleaned = String(value || "").trim();
  const blocked = ["", "her_name", "your_name", "name", "recipient", "sender"];
  if (blocked.indexOf(cleaned.toLowerCase()) !== -1) return "";
  return cleaned;
}

function personalize(text) {
  const name = realName(CONFIG.recipientName);
  const sender = realName(CONFIG.senderName);
  return String(text || "")
    .replaceAll("{name}", name)
    .replaceAll("{sender}", sender);
}

function joinList(items) {
  if (items.length === 0) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return items[0] + " and " + items[1];
  return items.slice(0, -1).join(", ") + ", and " + items[items.length - 1];
}

function plate(number) {
  return "No. " + String(number).padStart(2, "0");
}

function clockFor(index) {
  const extra = state.traits.stillness * 3;
  const total = 16 * 60 + 8 + index * 17 + extra;
  let hours = Math.floor(total / 60);
  const minutes = total % 60;
  const suffix = hours >= 12 ? "pm" : "am";
  hours = hours % 12;
  if (hours === 0) hours = 12;
  return hours + ":" + String(minutes).padStart(2, "0") + " " + suffix;
}

function sceneByIndex(index) {
  return SCENES[index];
}

function choiceById(scene, id) {
  return scene.choices.find(function (choice) { return choice.id === id; });
}

function applyTheme() {
  const root = document.documentElement;
  const colors = CONFIG.colors || {};
  Object.keys(colors).forEach(function (key) {
    const value = colors[key];
    if (typeof value === "string" && value.trim()) {
      root.style.setProperty("--" + key, value.trim());
    }
  });
  document.title = CONFIG.title || "The Photo Walk";
}

function updateChrome() {
  dom.roll.textContent = "Roll " + String(state.walk).padStart(2, "0");
  const show = phase !== "title";
  dom.progress.hidden = !show;
  const noun = state.photos.length === 1 ? "photograph" : "photographs";
  dom.count.innerHTML = state.photos.length + " / 5 <span class=\"sr-only\">" + noun + "</span>";
  const marks = dom.dots.querySelectorAll("span");
  marks.forEach(function (mark, index) {
    mark.classList.toggle("is-on", index < state.photos.length);
  });
}

function focusNode(id, visible) {
  const node = document.getElementById(id);
  if (!node) return;
  try {
    node.focus(visible ? { focusVisible: true } : undefined);
  } catch (error) {
    node.focus();
  }
}

function currentSceneId() {
  const scene = sceneByIndex(state.currentScene);
  return scene && scene.id ? scene.id : "path";
}

function resetTraits() {
  state.traits.curiosity = 0;
  state.traits.nature = 0;
  state.traits.detail = 0;
  state.traits.stillness = 0;
  state.traits.adventure = 0;
}

function setPageLocked(locked) {
  document.body.classList.toggle("is-modal", locked);
}

function closeLightbox() {
  if (dom.lightbox.open) dom.lightbox.close();
  setPageLocked(false);
}

let artSeq = 0;

function skyDef(id, c1, c2, c3) {
  return "<linearGradient id=\"" + id + "\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">" +
    "<stop offset=\"0%\" stop-color=\"" + c1 + "\"/>" +
    "<stop offset=\"52%\" stop-color=\"" + c2 + "\"/>" +
    "<stop offset=\"100%\" stop-color=\"" + c3 + "\"/></linearGradient>";
}

function vignetteDef(id) {
  return "<radialGradient id=\"" + id + "\" cx=\"50%\" cy=\"45%\" r=\"75%\">" +
    "<stop offset=\"58%\" stop-color=\"#2a2118\" stop-opacity=\"0\"/>" +
    "<stop offset=\"100%\" stop-color=\"#2a2118\" stop-opacity=\"0.2\"/></radialGradient>";
}

function svgWrap(height, defs, body) {
  const prefix = "a" + (++artSeq);
  const vig = prefix + "-vig";
  return "<svg class=\"art\" viewBox=\"0 0 600 " + height + "\" aria-hidden=\"true\">" +
    "<defs>" + defs + vignetteDef(vig) + "</defs>" +
    body +
    "<rect width=\"600\" height=\"" + height + "\" fill=\"url(#" + vig + ")\"/>" +
    "</svg>";
}

function sun(x, y, r, color) {
  return "<circle cx=\"" + x + "\" cy=\"" + y + "\" r=\"" + (r * 2.8) + "\" fill=\"" + color + "\" opacity=\"0.28\"/>" +
    "<circle cx=\"" + x + "\" cy=\"" + y + "\" r=\"" + r + "\" fill=\"" + color + "\"/>";
}

function cloud(x, y, s) {
  return "<g transform=\"translate(" + x + " " + y + ")\"><g class=\"cloud\">" +
    "<ellipse cx=\"0\" cy=\"0\" rx=\"" + (24 * s) + "\" ry=\"" + (8 * s) + "\" fill=\"#fffaf3\" opacity=\"0.55\"/>" +

    "<ellipse cx=\"" + (-14 * s) + "\" cy=\"" + (-2 * s) + "\" rx=\"" + (12 * s) + "\" ry=\"" + (7 * s) + "\" fill=\"#fffaf3\" opacity=\"0.4\"/>" +
    "</g></g>";
}

function bloom(cx, cy, size, petal, center, rot) {
  const angles = [0, 72, 144, 216, 288];
  const petals = angles.map(function (angle) {
    return "<ellipse cx=\"0\" cy=\"" + (-size) + "\" rx=\"" + (size * 0.46).toFixed(1) + "\" ry=\"" + (size * 0.72).toFixed(1) + "\" fill=\"" + petal + "\" transform=\"rotate(" + angle + ")\"/>";
  }).join("");
  return "<g transform=\"translate(" + cx + " " + cy + ") rotate(" + (rot || 0) + ")\">" + petals +
    "<circle r=\"" + (size * 0.32).toFixed(1) + "\" fill=\"" + center + "\"/></g>";
}

function stem(x1, y1, x2, y2, bend) {
  const mx = (x1 + x2) / 2 + (bend || 0);
  const my = (y1 + y2) / 2;
  return "<path d=\"M" + x1 + " " + y1 + " Q " + mx + " " + my + " " + x2 + " " + y2 + "\" fill=\"none\" stroke=\"#4c5b43\" stroke-width=\"2\" stroke-linecap=\"round\"/>";
}

function sash(x, y, w, h, frame, glass) {
  const m = Math.max(3, Math.round(Math.min(w, h) * 0.08));
  const innerW = w - m * 2;
  const paneH = (h - m * 3) / 2;
  return "<rect x=\"" + x + "\" y=\"" + y + "\" width=\"" + w + "\" height=\"" + h + "\" fill=\"" + frame + "\"/>" +
    "<rect x=\"" + (x + m) + "\" y=\"" + (y + m) + "\" width=\"" + innerW + "\" height=\"" + paneH + "\" fill=\"" + glass + "\"/>" +
    "<rect x=\"" + (x + m) + "\" y=\"" + (y + m * 2 + paneH) + "\" width=\"" + innerW + "\" height=\"" + paneH + "\" fill=\"" + glass + "\"/>" +
    "<rect x=\"" + (x + w / 2 - m * 0.45) + "\" y=\"" + (y + m) + "\" width=\"" + (m * 0.9) + "\" height=\"" + (h - m * 2) + "\" fill=\"" + frame + "\"/>";
}

function canopy(items) {
  return items.map(function (item) {
    return "<ellipse cx=\"" + item[0] + "\" cy=\"" + item[1] + "\" rx=\"" + item[2] + "\" ry=\"" + item[3] + "\" fill=\"" + item[4] + "\"/>";
  }).join("");
}

function falls(x, y, w, h, id) {
  let markup = "<linearGradient id=\"" + id + "\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">" +
    "<stop offset=\"0%\" stop-color=\"#f7fbfb\" stop-opacity=\"0.95\"/>" +
    "<stop offset=\"100%\" stop-color=\"#d5e4e8\" stop-opacity=\"0.12\"/></linearGradient>";
  const count = 5;
  for (let i = 0; i < count; i += 1) {
    const strand = w / count;
    markup += "<rect class=\"fall\" x=\"" + (x + i * strand) + "\" y=\"" + y + "\" width=\"" + (strand - 3) + "\" height=\"" + h + "\" rx=\"3\" fill=\"url(#" + id + ")\" style=\"animation-delay:" + (i * 0.25) + "s\"/>";
  }
  return markup;
}

function drawHill(mode) {
  const id = "hill-sky-" + mode + "-" + (++artSeq);
  const evening = skyDef(id, "#e7eef0", "#f3d2ba", "#f0b996");
  const landLow = mode === "sky" || mode === "away";
  const crooked = mode === "away" ? "<g transform=\"rotate(-2.2 300 220)\">" : "";
  const crookedEnd = mode === "away" ? "</g>" : "";
  const horizon = landLow ? 318 : 168;
  const body = crooked +
    sun(landLow ? 150 : 110, landLow ? 250 : 188, landLow ? 20 : 18, "#f8e3b8") +
    cloud(300, landLow ? 80 : 50, 1.1) +
    cloud(470, landLow ? 120 : 36, 0.7) +
    "<rect width=\"600\" height=\"400\" fill=\"url(#" + id + ")\"/>" +
    "<path d=\"M0 " + (horizon + 8) + " Q 180 " + (horizon - 36) + " 360 " + horizon + " T 600 " + (horizon - 10) + " L 600 400 L 0 400 Z\" fill=\"#b7c5c6\"/>" +
    "<path d=\"M0 " + (horizon + 36) + " Q 220 " + (horizon + 4) + " 420 " + (horizon + 30) + " T 600 " + (horizon + 16) + " L 600 400 L 0 400 Z\" fill=\"#8ea088\"/>" +
    "<path d=\"M0 " + (horizon + 78) + " Q 200 " + (horizon + 40) + " 380 " + (horizon + 70) + " T 600 " + (horizon + 48) + " L 600 400 L 0 400 Z\" fill=\"#5d6e56\"/>" +
    "<path d=\"M120 " + (horizon + 54) + " C 180 " + (horizon + 70) + ", 230 " + (horizon + 48) + ", 280 " + (horizon + 78) + "\" fill=\"none\" stroke=\"#d5e4e8\" stroke-width=\"3\"/>" +
    "<rect x=\"250\" y=\"" + (horizon + 34) + "\" width=\"16\" height=\"12\" fill=\"#e0c49c\"/>" +
    "<rect x=\"270\" y=\"" + (horizon + 28) + "\" width=\"20\" height=\"18\" fill=\"#d2b184\"/>" +
    "<rect x=\"294\" y=\"" + (horizon + 36) + "\" width=\"14\" height=\"10\" fill=\"#c9a56e\"/>" +
    canopy([
      [150, horizon + 62, 16, 12, "#3e4f3c"],
      [190, horizon + 56, 14, 11, "#31402f"],
      [430, horizon + 60, 18, 12, "#3e4f3c"]
    ]) +
    "<path d=\"M0 " + (horizon + 120) + " Q 300 " + (horizon + 90) + " 600 " + (horizon + 130) + " L 600 400 L 0 400 Z\" fill=\"#3e4f3c\"/>" +
    (mode === "sky" ? "<path d=\"M80 70 l8 6 l8 -6\" fill=\"none\" stroke=\"#5c5348\" stroke-width=\"1.4\"/>" : "") +
    crookedEnd;
  return svgWrap(400, evening, body);
}

function renderArt(name) {
  if (name === "poster") return drawPoster();
  if (name === "path" || name === "path-water" || name === "path-green" || name === "path-small") {
    const mode = name === "path" ? "place" : name.replace("path-", "");
    return drawPath(mode);
  }
  if (name === "garden" || name === "garden-flower" || name === "garden-wide" || name === "garden-detail") {
    const mode = name === "garden" ? "place" : name.replace("garden-", "");
    return drawGarden(mode === "wide" ? "place" : mode);
  }
  if (name === "water" || name === "water-fall" || name === "water-silver" || name === "water-still") {
    const mode = name === "water" ? "place" : name.replace("water-", "");
    return drawWater(mode === "fall" ? "fall" : mode);
  }
  if (name === "street" || name === "street-stone" || name === "street-door" || name === "street-window") {
    const mode = name === "street" ? "place" : name.replace("street-", "");
    return drawStreet(mode);
  }
  if (name === "hill" || name === "hill-view" || name === "hill-sky" || name === "hill-away") {
    const mode = name === "hill" ? "place" : name.replace("hill-", "");
    return drawHill(mode === "view" ? "place" : mode);
  }
  return drawPath("place");
}

/* ============================================================
   AUDIO
   Original, very quiet, synthesized. Never required.
   ============================================================ */
const audio = {
  ctx: null,
  master: null,
  filter: null,
  muted: true,
  failed: false
};

function ensureAudio() {
  if (audio.ctx || audio.failed) return !!audio.ctx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    audio.failed = true;
    return false;
  }
  try {
    const ctx = new Ctx();
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 520;
    filter.Q.value = 0.6;
    filter.connect(master);

    const length = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < length; i += 1) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.2;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.05;
    noise.connect(noiseGain);
    noiseGain.connect(filter);
    noise.start();

    const warm = ctx.createOscillator();
    warm.type = "sine";
    warm.frequency.value = 196;
    const warmGain = ctx.createGain();
    warmGain.gain.value = 0.012;
    warm.connect(warmGain);
    warmGain.connect(filter);
    warm.start();

    const fifth = ctx.createOscillator();
    fifth.type = "sine";
    fifth.frequency.value = 246.94;
    const fifthGain = ctx.createGain();
    fifthGain.gain.value = 0.008;
    fifth.connect(fifthGain);
    fifthGain.connect(filter);
    fifth.start();

    audio.ctx = ctx;
    audio.master = master;
    audio.filter = filter;
    return true;
  } catch (error) {
    audio.failed = true;
    return false;
  }
}

function fadeMaster(value) {
  if (!audio.master || !audio.ctx) return;
  const now = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(now);
  audio.master.gain.setValueAtTime(audio.master.gain.value, now);
  audio.master.gain.linearRampToValueAtTime(value, now + 0.6);
}

function setAmbience(kind) {
  if (!audio.filter || !audio.ctx || audio.muted) return;
  const freqs = { title: 480, path: 540, garden: 680, water: 320, street: 560, hill: 820 };
  const next = freqs[kind] || 520;
  const now = audio.ctx.currentTime;
  audio.filter.frequency.cancelScheduledValues(now);
  audio.filter.frequency.linearRampToValueAtTime(next, now + 1.2);
}

function shutterSound() {
  if (!audio.ctx || audio.muted || !audio.master) return;
  const ctx = audio.ctx;
  const length = Math.floor(ctx.sampleRate * 0.05);
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i += 1) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const gain = ctx.createGain();
  gain.gain.value = 0.18;
  const filter = ctx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 900;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(audio.master);
  source.start();
}

function syncMuteButton() {
  dom.mute.textContent = audio.failed ? "No sound" : (audio.muted ? "Sound off" : "Sound on");
  dom.mute.setAttribute("aria-pressed", audio.muted ? "false" : "true");
  dom.mute.disabled = audio.failed;
}

function toggleSound() {
  if (audio.failed) return;
  audio.muted = !audio.muted;
  if (!audio.muted) {
    if (!ensureAudio()) {
      audio.muted = true;
      syncMuteButton();
      return;
    }
    audio.ctx.resume().catch(function () {});
    fadeMaster(0.28);
    const sceneId = currentSceneId();
    const kinds = { title: "title", scene: sceneId, capture: sceneId, gallery: "hill" };
    setAmbience(kinds[phase] || "title");
  } else if (audio.ctx) {
    fadeMaster(0);
    const ctx = audio.ctx;
    setTimeout(function () {
      if (audio.muted && audio.ctx === ctx) {
        ctx.suspend().catch(function () {});
      }
    }, 700);
  }
  syncMuteButton();
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function renderTitle() {
  phase = "title";
  updateChrome();
  setAmbience("title");
  const title = escapeHtml(CONFIG.title || "The Photo Walk");
  dom.main.innerHTML =
    "<section class=\"title-screen\">" +
      "<div class=\"poster-slot print\" role=\"img\" aria-label=\"A small landscape of trees, water, and warm stone under a wide sky.\">" +
        "<div class=\"art-slot\">" + renderArt("poster") + "</div>" +
      "</div>" +
      "<div class=\"title-copy\">" +
        "<h1 class=\"game-title\" id=\"view-title\" tabindex=\"-1\">" + title + "</h1>" +
        "<p class=\"subtitle\">A small walk. A camera. A few things worth noticing.</p>" +
        "<div class=\"title-actions\"><button type=\"button\" class=\"btn\" data-action=\"begin\">Begin the walk</button></div>" +
        "<p class=\"whisper\">Take your time.</p>" +
      "</div>" +
    "</section>";
}

function sceneCopy(scene) {
  const previous = state.choices[state.choices.length - 1];
  const callback = CALLBACKS[scene.id] ? CALLBACKS[scene.id][previous] : "";
  const base = state.walk > 1 && scene.textAlt ? scene.textAlt : scene.text;
  return { callback: callback || "", base: base };
}

function renderScene() {
  phase = "scene";
  captureReady = false;
  clearTimers();
  const scene = sceneByIndex(state.currentScene);
  if (!scene) {
    state.currentScene = 0;
    renderTitle();
    return;
  }
  updateChrome();
  setAmbience(scene.id);
  const copy = sceneCopy(scene);
  const choices = renderChoices(scene);
  const lead = copy.callback ? "<p>" + escapeHtml(copy.callback) + "</p>" : "";
  dom.main.innerHTML =
    "<article class=\"scene\" data-scene=\"" + scene.id + "\">" +
      "<header class=\"scene-head\">" +
        "<h1 id=\"view-title\" tabindex=\"-1\">" + escapeHtml(scene.title) + "</h1>" +
        "<p>" + escapeHtml(scene.time) + "</p>" +
      "</header>" +
      "<figure class=\"print\">" +
        "<div class=\"art-slot\" role=\"img\" aria-label=\"" + escapeHtml(scene.alt) + "\">" + renderArt(scene.art) + "</div>" +
      "</figure>" +
      "<div class=\"prose\">" + lead + "<p>" + escapeHtml(copy.base) + "</p></div>" +
      "<div class=\"choices\" role=\"group\" aria-label=\"What do you notice?\">" + choices + "</div>" +
    "</article>";
  window.scrollTo({ top: 0, behavior: prefersReduced() ? "auto" : "smooth" });
  focusNode("view-title");
}

function renderChoices(scene) {
  return scene.choices.map(function (choice) {
    return "<button type=\"button\" class=\"choice\" data-action=\"choice\" data-choice=\"" + escapeHtml(choice.id) + "\">" +
      escapeHtml(choice.label) + "</button>";
  }).join("");
}

function renderCapture(choice, photo) {
  const scene = sceneByIndex(state.currentScene);
  if (!scene || !choice || !photo) {
    recover();
    return;
  }
  phase = "capture";
  captureReady = false;
  updateChrome();
  const kicker = choice.quiet ? "A quiet frame" : "Photograph added";
  const nextLabel = state.currentScene >= SCENES.length - 1 ? "See your walk" : "Keep walking";
  dom.main.innerHTML =
    "<article class=\"capture\" id=\"capture\">" +
      "<header class=\"capture-head\">" +
        "<h1 id=\"view-title\" tabindex=\"-1\">" + escapeHtml(scene.title) + "</h1>" +
        "<p>" + escapeHtml(scene.time) + "</p>" +
      "</header>" +
      "<p class=\"passage\" id=\"passage\" tabindex=\"-1\">" + escapeHtml(choice.passage) + "</p>" +
      "<div class=\"finder\" id=\"finder\">" +
        "<div class=\"corners\" aria-hidden=\"true\"><span></span><span></span><span></span><span></span></div>" +
        "<div class=\"shutter\" aria-hidden=\"true\"></div>" +
        "<div class=\"mat\">" +
          "<div class=\"art-slot\">" + renderArt(photo.art) + "</div>" +
          "<div class=\"mat-foot reveal\"><span>" + plate(photo.number) + "</span><span>" + escapeHtml(photo.clock) + "</span></div>" +
        "</div>" +
      "</div>" +
      "<div class=\"capture-copy\">" +
        "<p class=\"kicker\" id=\"kicker\"></p>" +
        "<p class=\"sr-only\" id=\"kicker-live\" aria-live=\"polite\"></p>" +
        "<h2 class=\"reveal\" id=\"capture-heading\" aria-hidden=\"true\">" + escapeHtml(photo.title) + "</h2>" +
        "<p class=\"capture-caption reveal\">" + escapeHtml(photo.caption) + "</p>" +
        "<button type=\"button\" class=\"btn\" id=\"continueBtn\" data-action=\"continue\" hidden>" + nextLabel + "</button>" +
      "</div>" +
    "</article>";
  window.scrollTo({ top: 0, behavior: prefersReduced() ? "auto" : "smooth" });
  playCapture(kicker, photo.title);
}

/* ============================================================
   CHOICE HANDLING
   ============================================================ */
function addTraits(traits) {
  Object.keys(traits || {}).forEach(function (key) {
    const amount = traits[key];
    if (typeof state.traits[key] !== "number") return;
    if (typeof amount !== "number" || !isFinite(amount)) return;
    state.traits[key] += amount;
  });
}

function makeChoice(choiceId) {
  if (phase !== "scene" || !inputOpen()) return;
  const scene = sceneByIndex(state.currentScene);
  const choice = scene && choiceById(scene, choiceId);
  if (!choice || !choice.photo) return;
  holdInput(INPUT_HOLD);
  addTraits(choice.traits || {});
  state.choices.push(choice.id);
  const photo = capturePhoto(choice);
  renderCapture(choice, photo);
}

function capturePhoto(choice) {
  const photo = {
    title: choice.photo.title,
    location: choice.photo.location,
    time: choice.photo.time,
    caption: choice.photo.caption,
    art: choice.photo.art,
    alt: choice.photo.alt,
    quiet: !!choice.quiet,
    number: state.photos.length + 1,
    clock: clockFor(state.photos.length)
  };
  addToGallery(photo);
  return photo;
}

function addToGallery(photo) {
  state.photos.push(photo);
  updateChrome();
}

function continueWalk() {
  if (phase !== "capture" || !captureReady || !inputOpen()) return;
  holdInput(INPUT_HOLD);
  clearTimers();
  captureReady = false;
  if (state.currentScene >= SCENES.length - 1) {
    renderGallery();
    return;
  }
  state.currentScene += 1;
  renderScene();
}

function startGame() {
  if (phase !== "title" || !inputOpen()) return;
  holdInput(INPUT_HOLD);
  clearTimers();
  state.currentScene = 0;
  state.photos = [];
  state.choices = [];
  resetTraits();
  state.secretClicks = 0;
  state.secretFound = false;
  captureReady = false;
  lightboxIndex = 0;
  renderScene();
}

/* ============================================================
   PHOTO GALLERY
   ============================================================ */
function renderGallery() {
  phase = "gallery";
  clearTimers();
  updateChrome();
  setAmbience("hill");
  const reflection = generateReflection();
  const cards = state.photos.map(function (photo, index) {
    const tilt = [-0.55, 0.4, -0.3, 0.45, -0.2][index] || 0;
    return "<button type=\"button\" class=\"photo-card\" style=\"--tilt:" + tilt + "deg\" data-action=\"open-photo\" data-index=\"" + index + "\">" +
      "<span class=\"art-slot\" aria-hidden=\"true\">" + renderArt(photo.art) + "</span>" +
      "<span class=\"ph-title\">" + escapeHtml(photo.title) + "</span>" +
      "<span class=\"ph-meta\">" + escapeHtml(photo.location) + " · " + escapeHtml(photo.time) + " · " + escapeHtml(photo.clock) + "</span>" +
      "<span class=\"ph-caption\">" + escapeHtml(photo.caption) + "</span>" +
      "</button>";
  }).join("");
  const secret = state.secretFound && (CONFIG.secretMessage || "").trim()
    ? "<p class=\"secret-line\">" + escapeHtml(personalize(CONFIG.secretMessage)) + "</p>"
    : "";
  dom.main.innerHTML =
    "<article class=\"album\">" +
      "<div class=\"album-kicker\">" +
        "<p class=\"eyebrow\">Roll " + String(state.walk).padStart(2, "0") + "</p>" +
        "<button type=\"button\" class=\"icon-btn\" id=\"secretBtn\" data-action=\"secret\" aria-label=\"A small camera\">" + cameraIcon() + "</button>" +
      "</div>" +
      "<h1 id=\"view-title\" tabindex=\"-1\">Your walk</h1>" +
      "<div class=\"secret-slot\" id=\"secretSlot\" aria-live=\"polite\">" + secret + "</div>" +
      "<div class=\"grid\">" + cards + "</div>" +
      "<section class=\"reflection\" aria-label=\"A small reflection\">" +
        "<h2 class=\"trait\">" + escapeHtml(reflection.title) + "</h2>" +
        "<p>" + escapeHtml(reflection.line) + "</p>" +
        "<p>" + escapeHtml(reflection.summary) + "</p>" +
        "<p class=\"landing\">Maybe that was the point.</p>" +
      "</section>" +
      personalNote() +
      "<div class=\"end-actions\"><button type=\"button\" class=\"btn btn-ghost\" data-action=\"restart\">Take another walk</button></div>" +
    "</article>";
  window.scrollTo({ top: 0, behavior: prefersReduced() ? "auto" : "smooth" });
  focusNode("view-title");
}

function personalNote() {
  if (!CONFIG.showPersonalMessage) return "";
  const message = personalize(CONFIG.finalMessage || "").trim();
  if (!message) return "";
  const name = realName(CONFIG.recipientName);
  const sender = realName(CONFIG.senderName);
  const paragraphs = message.split(/\n\s*\n/).map(function (part) {
    return "<p>" + escapeHtml(part).replace(/\n/g, "<br>") + "</p>";
  }).join("");
  const forLine = name ? "<p class=\"for\">For " + escapeHtml(name) + "</p>" : "";
  const sign = sender ? "<p class=\"sign\">— " + escapeHtml(sender) + "</p>" : "";
  return "<hr class=\"rule\">" +
    "<aside class=\"note\" aria-label=\"A note\">" + forLine + paragraphs + sign + "</aside>";
}

function openPhoto(index) {
  if (phase !== "gallery" || !inputOpen()) return;
  const photo = state.photos[index];
  if (!photo || !isFinite(index)) return;
  lightboxIndex = index;
  paintLightbox();
  if (dom.lightbox.open) return;
  setPageLocked(true);
  try {
    dom.lightbox.showModal();
  } catch (error) {
    setPageLocked(false);
    return;
  }
  focusNode("lb-title", true);
}

function paintLightbox() {
  const photo = state.photos[lightboxIndex];
  if (!photo) return;
  const last = state.photos.length - 1;
  dom.lightbox.setAttribute("aria-labelledby", "lb-title");
  dom.lightbox.innerHTML =
    "<article class=\"lb-card\">" +
      "<div class=\"lb-top\">" +
        "<p class=\"lb-count\">" + (lightboxIndex + 1) + " of " + state.photos.length + "</p>" +
        "<button type=\"button\" class=\"text-btn\" data-action=\"close-photo\">Close</button>" +
      "</div>" +
      "<div class=\"art-slot\" role=\"img\" aria-label=\"" + escapeHtml(photo.alt) + "\">" + renderArt(photo.art) + "</div>" +
      "<h2 id=\"lb-title\" tabindex=\"-1\">" + escapeHtml(photo.title) + "</h2>" +
      "<p class=\"lb-meta\">" + escapeHtml(photo.location) + " · " + escapeHtml(photo.time) + " · " + escapeHtml(photo.clock) + " · " + plate(photo.number) + "</p>" +
      "<p class=\"lb-caption\">" + escapeHtml(photo.caption) + "</p>" +
      "<div class=\"lb-nav\">" +
        "<button type=\"button\" class=\"text-btn\" data-action=\"photo-prev\"" + (lightboxIndex === 0 ? " disabled" : "") + ">Previous</button>" +
        "<button type=\"button\" class=\"text-btn\" data-action=\"photo-next\"" + (lightboxIndex === last ? " disabled" : "") + ">Next</button>" +
      "</div>" +
    "</article>";
}

function stepPhoto(direction) {
  if (!dom.lightbox.open) return;
  const next = lightboxIndex + direction;
  if (next < 0 || next >= state.photos.length) return;
  lightboxIndex = next;
  paintLightbox();
  focusNode("lb-title", true);
}

function pokeSecret() {
  if (state.secretFound) return;
  state.secretClicks += 1;
  const button = document.getElementById("secretBtn");
  if (button) {
    button.classList.remove("is-tapped");
    void button.offsetWidth;
    button.classList.add("is-tapped");
  }
  if (state.secretClicks < 3) return;
  state.secretFound = true;
  const message = personalize(CONFIG.secretMessage || "").trim();
  const slot = document.getElementById("secretSlot");
  if (slot && message) {
    slot.innerHTML = "<p class=\"secret-line\">" + escapeHtml(message) + "</p>";
  }
}

/* ============================================================
   FINAL REFLECTION
   ============================================================ */
function generateReflection() {
  const traits = state.traits;
  const scores = [
    { key: "detail", value: traits.detail },
    { key: "explorer", value: traits.curiosity + traits.adventure },
    { key: "nature", value: traits.nature },
    { key: "stillness", value: traits.stillness }
  ].sort(function (a, b) { return b.value - a.value; });

  const top = scores[0];
  const second = scores[1];
  let chosen = top && REFLECTIONS[top.key] ? REFLECTIONS[top.key] : REFLECTIONS.detail;
  if (top && second && second.value > 0 && top.value - second.value <= 1) {
    const key = [top.key, second.key].sort().join("+");
    if (COMBOS[key]) chosen = COMBOS[key];
  }

  const phrases = state.choices.map(function (id) {
    for (let i = 0; i < SCENES.length; i += 1) {
      const match = choiceById(SCENES[i], id);
      if (match && match.summary) return match.summary;
    }
    return "";
  }).filter(Boolean);

  return {
    title: chosen && chosen.title ? chosen.title : "The walk",
    line: chosen && chosen.line ? chosen.line : "You noticed what the afternoon was willing to show you.",
    summary: phrases.length ? "You " + joinList(phrases) + "." : "You took the walk."
  };
}

/* ============================================================
   ANIMATION
   ============================================================ */
function playCapture(kicker, title) {
  const finder = document.getElementById("finder");
  const root = document.getElementById("capture");
  const heading = document.getElementById("capture-heading");
  const live = document.getElementById("kicker-live");
  const label = document.getElementById("kicker");
  const button = document.getElementById("continueBtn");
  focusNode("passage");

  function finish() {
    if (phase !== "capture" || !root || !root.isConnected) return;
    captureReady = true;
    if (finder) finder.classList.add("is-developed");
    root.classList.add("is-ready");
    if (heading) heading.removeAttribute("aria-hidden");
    if (label) label.textContent = kicker;
    if (live) live.textContent = kicker + ". " + title + ".";
    if (button) button.hidden = false;
    const active = document.activeElement;
    if (button && (!active || active === document.body || root.contains(active))) {
      focusNode("continueBtn", true);
    }
  }

  if (prefersReduced()) {
    finish();
    return;
  }

  later(function () {
    if (phase !== "capture" || !finder) return;
    finder.classList.add("is-shutter");
    shutterSound();
  }, 680);

  later(function () {
    if (phase !== "capture" || !finder) return;
    finder.classList.remove("is-shutter");
    finder.classList.add("is-developed");
  }, 1280);

  later(finish, 2050);
}

/* ============================================================
   RESET / REPLAY
   ============================================================ */
function restartGame() {
  if (phase !== "gallery" || !inputOpen()) return;
  holdInput(INPUT_HOLD);
  clearTimers();
  const nextWalk = state.walk + 1;
  state.currentScene = 0;
  state.photos = [];
  state.choices = [];
  resetTraits();
  state.walk = nextWalk;
  state.secretClicks = 0;
  state.secretFound = false;
  captureReady = false;
  lightboxIndex = 0;
  closeLightbox();
  renderScene();
}

function recover() {
  if (recovering) return;
  recovering = true;
  try {
    clearTimers();
    heldUntil = 0;
    closeLightbox();
    if (state.photos.length >= SCENES.length) {
      captureReady = true;
      renderGallery();
      return;
    }
    const scene = sceneByIndex(state.currentScene);
    if (scene && state.photos.length === state.currentScene + 1) {
      const choice = choiceById(scene, state.choices[state.currentScene]);
      const photo = state.photos[state.currentScene];
      if (choice && photo) {
        renderCapture(choice, photo);
        return;
      }
    }
    if (scene && state.photos.length === state.currentScene) {
      captureReady = false;
      renderScene();
      return;
    }
    state.currentScene = 0;
    captureReady = false;
    renderTitle();
  } finally {
    recovering = false;
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
function onClick(event) {
  const button = event.target.closest("[data-action]");
  if (!button || button.disabled) return;
  if (keyIsRepeating && event.detail === 0) return;
  const action = button.dataset.action;
  try {
    if (action === "begin") startGame();
    else if (action === "choice") makeChoice(button.dataset.choice);
    else if (action === "continue") continueWalk();
    else if (action === "restart") restartGame();
    else if (action === "open-photo") openPhoto(Number(button.dataset.index));
    else if (action === "photo-prev") stepPhoto(-1);
    else if (action === "photo-next") stepPhoto(1);
    else if (action === "close-photo") closeLightbox();
    else if (action === "secret") pokeSecret();
    else if (action === "mute") toggleSound();
  } catch (error) {
    recover();
  }
}

document.addEventListener("click", onClick);

document.addEventListener("keydown", function (event) {
  if (event.repeat) keyIsRepeating = true;
  if (event.key === "Escape" && dom.lightbox.open) {
    setTimeout(closeLightbox, 0);
  }
  if (!dom.lightbox.open) return;
  if (event.key === "ArrowRight") {
    event.preventDefault();
    stepPhoto(1);
  }
  if (event.key === "ArrowLeft") {
    event.preventDefault();
    stepPhoto(-1);
  }
});

document.addEventListener("keyup", function () {
  keyIsRepeating = false;
});

window.addEventListener("blur", function () {
  keyIsRepeating = false;
});

dom.lightbox.addEventListener("click", function (event) {
  if (event.target === dom.lightbox) closeLightbox();
});

dom.lightbox.addEventListener("close", function () {
  setPageLocked(false);
});

applyTheme();
syncMuteButton();
renderTitle();
</script>
